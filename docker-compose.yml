services:
  mysql:
    image: mysql:8.0
    container_name: localbazaar-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-BCA@123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-localbazaar}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/localbazaar.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - localbazaar-net

  backend:
    build:
      context: ./LocalBazaarBackend/LocalBazaarBackend/backend
      dockerfile: Dockerfile
    container_name: localbazaar-backend
    restart: always
    depends_on:
      - mysql
    environment:
      PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-localbazaar}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-BCA@123}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost}
      JWT_SECRET: ${JWT_SECRET:-localbazaar-dev-secret-change-me-32chars-min!!}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
    ports:
      - "8081:8081"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - localbazaar-net

  frontend:
    build:
      context: ./LocalBazarFrontend/LocalBazarFrontend/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: localbazaar-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - localbazaar-net

volumes:
  mysql_data:
  backend_uploads:

networks:
  localbazaar-net:
    driver: bridge
