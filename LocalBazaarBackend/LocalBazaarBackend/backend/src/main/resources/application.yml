server:
  port: ${PORT:8081}

spring:
  application:
    name: localbazaar
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 16MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/localbazaar?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:BCA@123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:localbazaar-dev-secret-change-me-32chars-min!!}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
  cloudinary:
    url: ${CLOUDINARY_URL:}
  mail:
    from: ${MAIL_FROM:noreply@localbazaar.local}
  dev:
    auto-approve-sellers: false
